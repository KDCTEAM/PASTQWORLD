<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Subscribing</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fafbff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .thank-you-container {
            max-width: 400px;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            border: 2px solid #83d1fc;
        }

        .thank-you-container h1 {
            font-size: 24px;
            color: #333;
        }

        .thank-you-container p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .thank-you-container a {
            text-decoration: none;
            background-color: #51bffb;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            display: inline-block;
        }

        .thank-you-container a:hover {
            background-color: #83d1fc;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <h1>Thank You for Subscribing!</h1>
        <p>You will now receive our updates directly to your inbox.</p>
        <a href="https://pastqworld.com.ng/">Continue to Website</a>
    </div>
</body>
</html>
